spring.application.name=alert-service
server.port = 8084

###############################################################################
# Kafka Consumer Infrastructure Configuration
###############################################################################
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=alert-service

# Fixed property keys configuration strings
spring.kafka.consumer.properties.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.value.deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Explicit trusted packages and type mapping configurations
spring.kafka.consumer.properties.spring.json.trusted.packages=com.*
spring.kafka.consumer.properties.spring.json.type.mapping=alertingEvent:com.kushal.kafka.event.AlertingEvent

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/home_energy_tracker
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none

# Mailpit SMTP Configuration
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false